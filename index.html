<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>원신 보상 계산기</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f5f7;
  color: #333;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 20px;
}

h1 {
  text-align: center;
  margin: 10px 0 5px;
}

.subtitle {
  text-align: center;
  color: #777;
  margin-bottom: 20px;
}

.section {
  background: white;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

.section h2 {
  margin-top: 0;
  font-size: 20px;
}

.task {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 8px;
  border-bottom: 1px solid #eee;
  cursor: pointer;
}

.task:last-child {
  border-bottom: none;
}

.task input {
  width: 22px;
  height: 22px;
  cursor: pointer;
}

.task span {
  font-size: 16px;
}

.task.done span {
  text-decoration: line-through;
  color: #aaa;
}

.info {
  font-size: 13px;
  color: #888;
  margin-top: 8px;
}

button {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 12px;
  background: #555;
  color: white;
  font-size: 15px;
  cursor: pointer;
}

button:active {
  transform: scale(0.98);
}
</style>
</head>

<body>

<div class="container">

  <h1>원신 보상 계산기</h1>
  <div class="subtitle">오늘 할 일을 체크해보세요</div>

  <div class="section">
    <h2>🌅 일일 임무</h2>

    <label class="task">
      <input type="checkbox" data-task="daily1">
      <span>일일 의뢰 완료</span>
    </label>

    <label class="task">
      <input type="checkbox" data-task="daily2">
      <span>퓨어 레진 사용</span>
    </label>

    <label class="task">
      <input type="checkbox" data-task="daily3">
      <span>모험가 길드 보상 수령</span>
    </label>

    <label class="task">
      <input type="checkbox" data-task="daily4">
      <span>탐험 파견 보상 수령</span>
    </label>

    <label class="task">
      <input type="checkbox" data-task="daily5">
      <span>선계 보상 확인</span>
    </label>

    <div class="info" id="realmInfo"></div>
  </div>

  <div class="section">
    <h2>🎭 환상극</h2>

    <label class="task">
      <input type="checkbox" data-task="theater">
      <span>환상극 확인</span>
    </label>
  </div>

  <div class="section">
    <button onclick="resetTasks()">오늘 체크 초기화</button>
  </div>

</div>

<script>
const today = new Date().toDateString();

const savedDate = localStorage.getItem("genshinTodoDate");

if (savedDate !== today) {
  localStorage.removeItem("genshinTodo");
  localStorage.setItem("genshinTodoDate", today);
}

const checkboxes = document.querySelectorAll("input[type='checkbox']");

function loadTasks() {
  const saved = JSON.parse(localStorage.getItem("genshinTodo") || "{}");

  checkboxes.forEach(box => {
    box.checked = saved[box.dataset.task] === true;
    updateStyle(box);
  });

  updateRealm();
}

function saveTasks() {
  const data = {};

  checkboxes.forEach(box => {
    data[box.dataset.task] = box.checked;
    updateStyle(box);
  });

  localStorage.setItem("genshinTodo", JSON.stringify(data));

  if (document.querySelector("[data-task='daily5']").checked) {
    if (!localStorage.getItem("realmCompleted")) {
      localStorage.setItem(
        "realmCompleted",
        new Date().getTime()
      );
    }
  }

  updateRealm();
}

function updateStyle(box) {
  const task = box.closest(".task");

  if (box.checked) {
    task.classList.add("done");
  } else {
    task.classList.remove("done");
  }
}

function updateRealm() {
  const info = document.getElementById("realmInfo");
  const last = localStorage.getItem("realmCompleted");

  if (!last) {
    info.textContent = "선계 보상 확인 가능";
    return;
  }

  const threeDays = 3 * 24 * 60 * 60 * 1000;
  const next = Number(last) + threeDays;
  const remain = next - Date.now();

  if (remain <= 0) {
    info.textContent = "선계 보상 확인 가능";
  } else {
    const days = Math.floor(remain / (24 * 60 * 60 * 1000));
    const hours = Math.floor(
      (remain % (24 * 60 * 60 * 1000)) /
      (60 * 60 * 1000)
    );

    info.textContent =
      `다음 선계 보상까지 약 ${days}일 ${hours}시간`;
  }
}

checkboxes.forEach(box => {
  box.addEventListener("change", saveTasks);
});

function resetTasks() {
  if (confirm("오늘 체크를 모두 초기화할까요?")) {
    localStorage.removeItem("genshinTodo");
    localStorage.removeItem("genshinTodoDate");
    location.reload();
  }
}

loadTasks();
</script>

</body>
</html>
